name: Release

on:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Get version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches.Groups[1].Value
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "Version: $version"

      - name: Create release tag
        id: create_tag
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $commit_sha = "${{ github.sha }}"
          $tag_name = "v$version-$($commit_sha.Substring(0,7))"
          echo "TAG_NAME=$tag_name" >> $env:GITHUB_OUTPUT
          echo "Tag: $tag_name"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.create_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.create_tag.outputs.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            target/release/kakapo.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
